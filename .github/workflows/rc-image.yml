name: RC image (test only)

on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

jobs:
  rc-image:
    # Builds Containerfile.rc and pushes frapercan/fantasia:4.1.2-rc1 for HPC tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: frapercan/protein-information-system-fix
          ref: fix/surface-task-failures
          path: pis
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u frapercan --password-stdin
      - name: Build
        run: docker build -f Containerfile.rc -t frapercan/fantasia:4.1.2-rc1 .
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh frapercan/fantasia:4.1.2-rc1 -c '
            pg_restore --version
            pip show fantasia protein_information_system | grep -E "^(Name|Version)"
            cd /tmp && fantasia --help | head -5'
      - name: Push
        run: docker push frapercan/fantasia:4.1.2-rc1

  poetry-dockerfile:
    # Diagnostic only: does the release Dockerfile (poetry, no lock) finish resolving?
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
      - uses: actions/checkout@v4
      - name: Build ./Dockerfile
        run: time docker build -f Dockerfile -t fantasia:poetry-check .
